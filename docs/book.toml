[book]
title = "docker-mdbook"
authors = ["nkenbou"]
language = "ja"
src = "."

[preprocessor.toc]
command = "mdbook-toc"
renderer = ["html"]

[preprocessor.plantuml]
plantuml-cmd = "plantuml"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
theme = "theme"
additional-css = [".mdbook/custom.css"]
additional-js = [
  ".mdbook/mermaid.min.js",
  ".mdbook/mermaid-init.js",
]
